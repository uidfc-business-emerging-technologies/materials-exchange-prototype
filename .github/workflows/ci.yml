# Checks every pull request and every push to main. Deploys are Workers Builds' job (see README, Deploy):
# it builds main for production and each pull request branch as a Worker Preview.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Workers Builds only builds, so type errors are caught here.
      - run: npm run typecheck
      - run: npx cf build
      # Validates the Worker without credentials or uploading anything.
      - run: npx cf deploy --prebuilt --mode production --dry-run
